# Site nginx de QuestionnApp (à copier dans /etc/nginx/sites-available/questionnapp,
# en remplaçant DOMAINE par le nom de domaine, puis à activer).
# certbot (« certbot --nginx -d DOMAINE ») ajoute ensuite lui-même la partie HTTPS (port 443),
# la redirection automatique de http vers https et le renouvellement du certificat.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE;

    # taille maximale d'une requête (identique à la limite de l'appli)
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # adresse réelle du visiteur (journal des connexions, limitation des tentatives)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # la correction d'un code d'élève peut prendre quelques secondes
        proxy_read_timeout 90s;
    }
}
